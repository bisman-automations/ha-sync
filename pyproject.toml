# Tool settings only: this repo isn't a Python package, and the version lives
# in custom_components/mac_sync/manifest.json. The pytest, ruff and coverage
# settings follow bisman-automations/.github templates/repo/pyproject.toml.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
# Home Assistant 2024.6, the minimum in hacs.json, runs on Python 3.12.
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "homeassistant", "tests"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.coverage.run]
source = ["custom_components/mac_sync"]

[tool.coverage.report]
show_missing = true
skip_covered = true
